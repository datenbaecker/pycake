[project]
name = "pycake"
version = "0.0.1.0"
dependencies=[
    "numpy>=2.0.2",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "requests>=2.0.4",
    "rich>=14.0.0",
    "appdirs>=1.4.4"
]
authors = [
  { name="Lukas Huwiler", email="lukas.huwiler@datenbaecker.ch" },
  { name="Jenjira Danphongphan", email="jenjira.danphongphan@datenbaecker.ch" }
]
description = "This package enriches your data with openly accessible government data. Get openly accessible information for Switzerland without tedious data preparation."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "hhttps://github.com/datenbaecker/pycake"
Issues = "https://github.com/datenbaecker/pycake/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
